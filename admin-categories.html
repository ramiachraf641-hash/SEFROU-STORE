<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة التصنيفات | SEFROU STORE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .admin-categories-page{max-width:1200px;margin:auto;padding:35px 20px 70px;font-family:Cairo,Arial,sans-serif}.admin-categories-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin:28px 0}.admin-categories-head h1{margin:0 0 6px;font-size:30px}.admin-categories-head p{margin:0;color:#777;font-weight:600;font-size:13px}.admin-categories-layout{display:grid;grid-template-columns:minmax(280px,.8fr) minmax(0,1.5fr);gap:20px;align-items:start}.admin-category-panel{background:#fff;border:1px solid #e5e5e5;border-radius:16px;padding:22px;box-shadow:0 5px 20px #00000008}.admin-category-panel h2{margin:0 0 16px;font-size:19px}.admin-category-form{display:grid;gap:13px}.admin-category-field{display:grid;gap:6px}.admin-category-field label{font-size:13px;font-weight:800;color:#444}.admin-category-field input,.admin-category-field textarea{width:100%;box-sizing:border-box;border:1px solid #ddd;border-radius:9px;padding:10px;font:inherit}.admin-category-field textarea{min-height:75px;resize:vertical}.admin-category-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.admin-category-check{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:700}.admin-category-image{min-height:130px;border:1px dashed #ccc;border-radius:10px;display:grid;place-items:center;color:#999;overflow:hidden}.admin-category-image img{width:100%;height:150px;object-fit:cover}.admin-category-submit,.admin-category-new{min-height:44px;border:0;border-radius:9px;background:#171717;color:#fff;padding:0 14px;font:inherit;font-weight:800;cursor:pointer}.admin-category-new{background:#fff;color:#222;border:1px solid #ddd}.admin-category-message{display:none;padding:10px;border-radius:9px;font-size:12px;font-weight:700}.admin-category-message.show{display:block}.admin-category-message.error{background:#fff0f0;color:#a22}.admin-category-message.success{background:#edf9f1;color:#176b3b}.admin-category-list{display:grid;gap:11px}.admin-category-card{display:grid;grid-template-columns:82px minmax(0,1fr) auto;gap:13px;align-items:center;border:1px solid #e7e7e7;border-radius:12px;padding:11px}.admin-category-card img{width:82px;height:72px;object-fit:cover;border-radius:9px;background:#f5f5f5}.admin-category-card h3{margin:0 0 4px;font-size:16px}.admin-category-card p{margin:0;color:#777;font-size:12px}.admin-category-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.admin-category-meta span{padding:3px 7px;border-radius:20px;background:#f2f2f2;font-size:10px;font-weight:800}.admin-category-meta .off{background:#fff0f0;color:#a22}.admin-category-actions{display:flex;gap:7px;flex-direction:column}.admin-category-actions button{border:0;border-radius:7px;padding:8px 10px;font:inherit;font-size:11px;font-weight:800;cursor:pointer}.admin-category-edit{background:#f1f1f1}.admin-category-toggle{background:#edf9f1}.admin-category-delete{background:#fff0f0;color:#a22}@media(max-width:800px){.admin-categories-layout{grid-template-columns:1fr}.admin-categories-head{flex-direction:column}.admin-category-new{width:100%}}@media(max-width:560px){.admin-categories-page{padding:20px 12px 50px}.admin-category-row{grid-template-columns:1fr}.admin-category-card{grid-template-columns:62px minmax(0,1fr)}.admin-category-card img{width:62px;height:62px}.admin-category-actions{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr)}.admin-category-actions button{padding:9px 4px}}
    </style>
</head>
<body>
<main class="admin-categories-page">
    <nav class="admin-reviews-nav" aria-label="روابط الإدارة"><a href="admin-orders.html">الطلبات</a><a href="admin-products.html">المنتجات</a><a class="active" href="admin-categories.html">التصنيفات</a><a href="admin-reviews.html">التقييمات</a><a href="admin-newsletter.html">النشرة البريدية</a></nav>
    <header class="admin-categories-head"><div><h1>إدارة التصنيفات</h1><p>أضف وعدّل تصنيفات المتجر والصور والترتيب من هنا.</p></div><button id="adminCategoryNew" class="admin-category-new" type="button"><i class="fa-solid fa-plus"></i> تصنيف جديد</button></header>
    <section class="admin-categories-layout">
        <aside class="admin-category-panel"><h2 id="adminCategoryFormTitle">إضافة تصنيف</h2><form id="adminCategoryForm" class="admin-category-form"><input type="hidden" id="adminCategoryId"><div id="adminCategoryMessage" class="admin-category-message"></div><div class="admin-category-field"><label for="adminCategoryName">اسم التصنيف *</label><input id="adminCategoryName" maxlength="120" required></div><div class="admin-category-field"><label for="adminCategoryDescription">الوصف</label><textarea id="adminCategoryDescription" maxlength="500"></textarea></div><div class="admin-category-row"><div class="admin-category-field"><label for="adminCategoryOrder">الترتيب</label><input id="adminCategoryOrder" type="number" min="0" step="1" value="0"></div><label class="admin-category-check"><input id="adminCategoryActive" type="checkbox" checked> ظاهر للزبائن</label></div><div class="admin-category-field"><label for="adminCategoryImage">الصورة</label><input id="adminCategoryImage" type="file" accept="image/jpeg,image/png,image/webp"><small>JPG أو PNG أو WebP، حتى 5MB.</small></div><div id="adminCategoryImagePreview" class="admin-category-image"><i class="fa-solid fa-image"></i></div><button id="adminCategorySubmit" class="admin-category-submit" type="submit">حفظ التصنيف</button></form></aside>
        <section class="admin-category-panel"><h2>كل التصنيفات</h2><div id="adminCategoryList" class="admin-category-list">جاري التحميل...</div></section>
    </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase.js"></script><script src="assets/js/admin-categories.js"></script>
</body></html>
