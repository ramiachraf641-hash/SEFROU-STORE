<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>إدارة الطلبات | SEFROU STORE</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <!-- Main CSS -->
    <link
        rel="stylesheet"
        href="assets/css/style.css"
    >

    <style>

        /* =====================================================
           ADMIN ORDERS PAGE
        ===================================================== */

        .admin-orders-page {

            max-width: 1250px;

            margin: 0 auto;

            padding: 40px 20px 70px;

            font-family:
                "Cairo",
                Arial,
                sans-serif;
        }


        /* ================= HEADER ================= */

        .admin-orders-header {

            margin-bottom: 30px;
        }


        .admin-orders-header h1 {

            margin: 0 0 8px;

            font-size: 32px;

            font-weight: 900;

            color: #171717;
        }


        .admin-orders-header p {

            margin: 0;

            color: #777;

            font-size: 15px;

            font-weight: 600;
        }


        /* ================= TOOLBAR ================= */

        .admin-orders-toolbar {

            display: flex;

            align-items: center;

            gap: 12px;

            margin-bottom: 25px;

            flex-wrap: wrap;
        }


        .admin-orders-search {

            flex: 1;

            min-width: 250px;

            height: 46px;

            padding: 0 16px;

            border: 1px solid #e5e7eb;

            border-radius: 10px;

            background: #ffffff;

            font-family: inherit;

            font-size: 14px;

            outline: none;

            transition: 0.2s ease;
        }


        .admin-orders-search:focus {

            border-color: #999;

            box-shadow:
                0 0 0 3px
                rgba(0, 0, 0, 0.05);
        }


        .admin-orders-filter {

            height: 46px;

            min-width: 180px;

            padding: 0 14px;

            border: 1px solid #e5e7eb;

            border-radius: 10px;

            background: #fff;

            font-family: inherit;

            font-size: 14px;

            font-weight: 600;

            color: #333;

            cursor: pointer;

            outline: none;
        }


        .admin-orders-refresh,
        .admin-order-details-btn {

            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: 0;
            border-radius: 10px;
            background: #171717;
            color: #fff;
            font-family: inherit;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.2s ease;
        }


        .admin-orders-refresh {

            height: 46px;
            padding: 0 17px;
            white-space: nowrap;
        }


        .admin-orders-refresh:hover,
        .admin-order-details-btn:hover {

            background: #333;
            transform: translateY(-1px);
        }


        .admin-orders-refresh:disabled {

            opacity: 0.7;
            cursor: wait;
            transform: none;
        }


        /* ================= STATS ================= */

        .admin-orders-stats {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 15px;

            margin-bottom: 30px;
        }


        .admin-stat-card {

            padding: 20px;

            background: #fff;

            border: 1px solid #eeeeee;

            border-radius: 15px;

            box-shadow:
                0 5px 20px
                rgba(0, 0, 0, 0.04);
        }


        .admin-stat-card span {

            display: block;

            margin-bottom: 6px;

            color: #888;

            font-size: 13px;

            font-weight: 700;
        }


        .admin-stat-card strong {

            font-size: 24px;

            font-weight: 900;

            color: #171717;
        }


        /* ================= ORDERS ================= */

        #adminOrders {

            width: 100%;
        }


        .admin-order-card {

            margin-bottom: 20px;

            padding: 25px;

            background: #fff;

            border: 1px solid #e8e8e8;

            border-radius: 18px;

            box-shadow:
                0 5px 20px
                rgba(0, 0, 0, 0.05);

            overflow: hidden;
        }


        /* ================= ORDER HEADER ================= */

        .admin-order-header {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 20px;

            padding-bottom: 18px;

            border-bottom: 1px solid #eeeeee;
        }


        .admin-order-number {

            display: flex;

            flex-direction: column;

            gap: 4px;
        }


        .admin-order-label {

            font-size: 12px;

            color: #999;

            font-weight: 700;
        }


        .admin-order-number strong {

            font-size: 17px;

            font-weight: 900;

            color: #171717;
        }


        /* ================= STATUS ================= */

        .admin-order-status {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            padding: 7px 14px;

            border-radius: 30px;

            font-size: 13px;

            font-weight: 800;

            white-space: nowrap;
        }


        .status-pending {

            background: #fff4d6;

            color: #a66b00;
        }


        .status-confirmed {

            background: #e7f7ed;

            color: #16834b;
        }


        .status-processing {

            background: #e8f1ff;

            color: #2463c5;
        }


        .status-shipped {

            background: #eee9ff;

            color: #6741d9;
        }


        .status-delivered {

            background: #e4f8f0;

            color: #087f5b;
        }


        .status-cancelled {

            background: #ffe8e8;

            color: #c92a2a;
        }


        /* ================= CUSTOMER ================= */

        .admin-order-customer {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 12px;

            margin: 18px 0;

            padding: 16px;

            background: #fafafa;

            border-radius: 12px;
        }


        .admin-customer-item {

            display: flex;

            align-items: center;

            gap: 8px;

            font-size: 14px;

            font-weight: 700;

            color: #555;
        }


        .admin-customer-item i {

            color: #777;

            width: 18px;

            text-align: center;
        }


        /* ================= PRODUCTS ================= */

        .admin-order-products {

            display: flex;

            flex-direction: column;

            gap: 10px;

            margin-bottom: 20px;
        }


        .admin-order-product {

            display: flex;

            align-items: center;

            gap: 14px;

            padding: 12px;

            border: 1px solid #eeeeee;

            border-radius: 12px;

            background: #fff;
        }


        .admin-product-image {

            width: 60px;

            height: 60px;

            flex-shrink: 0;

            overflow: hidden;

            border-radius: 9px;

            background: #f2f2f2;
        }


        .admin-product-image img {

            width: 100%;

            height: 100%;

            object-fit: cover;

            display: block;
        }


        .admin-product-info {

            flex: 1;

            min-width: 0;
        }


        .admin-product-info h4 {

            margin: 0 0 4px;

            font-size: 15px;

            font-weight: 900;

            color: #222;
        }


        .admin-product-info p {

            margin: 0;

            font-size: 13px;

            font-weight: 600;

            color: #888;
        }


        .admin-product-price {

            font-size: 15px;

            font-weight: 900;

            color: #222;
        }


        /* ================= FOOTER ================= */

        .admin-order-footer {

            display: flex;

            align-items: flex-end;

            justify-content: space-between;

            gap: 20px;

            padding-top: 18px;

            border-top: 1px solid #eeeeee;
        }


        .admin-order-details-btn {

            min-height: 42px;
            padding: 0 14px;
            background: #f3f4f6;
            color: #222;
        }


        .admin-order-details-btn:hover {

            background: #e5e7eb;
        }


        .admin-payment {

            display: flex;

            flex-direction: column;

            gap: 5px;
        }


        .admin-payment span,
        .admin-total span {

            font-size: 12px;

            font-weight: 700;

            color: #999;
        }


        .admin-payment strong {

            font-size: 14px;

            font-weight: 800;

            color: #333;
        }


        .admin-total {

            display: flex;

            flex-direction: column;

            gap: 4px;

            text-align: left;
        }


        .admin-total strong {

            font-size: 22px;

            font-weight: 900;

            color: #171717;
        }


        /* ================= EMPTY ================= */

        .admin-orders-empty {

            padding: 60px 20px;

            text-align: center;

            background: #fafafa;

            border: 1px dashed #ddd;

            border-radius: 18px;
        }


        .admin-orders-empty i {

            display: block;

            margin-bottom: 15px;

            font-size: 45px;

            color: #aaa;
        }


        .admin-orders-empty h3 {

            margin: 0 0 8px;

            font-size: 20px;

            font-weight: 900;

            color: #333;
        }


        .admin-orders-empty p {

            margin: 0;

            font-size: 14px;

            color: #888;

            font-weight: 600;
        }


        /* ================= LOADING ================= */

        .admin-orders-loading {

            padding: 50px;

            text-align: center;

            color: #777;

            font-size: 15px;

            font-weight: 700;
        }


        .admin-orders-loading i {

            margin-left: 8px;
        }


        /* ================= ACCESS DENIED ================= */

        .admin-access-denied {

            max-width: 500px;

            margin: 80px auto;

            padding: 40px 25px;

            text-align: center;

            background: #fff;

            border: 1px solid #eeeeee;

            border-radius: 20px;

            box-shadow:
                0 10px 35px
                rgba(0, 0, 0, 0.06);
        }


        .admin-access-denied i {

            display: block;

            margin-bottom: 18px;

            font-size: 45px;

            color: #d63031;
        }


        .admin-access-denied h2 {

            margin: 0 0 10px;

            font-size: 22px;

            font-weight: 900;
        }


        .admin-access-denied p {

            margin: 0;

            color: #777;

            font-size: 14px;

            font-weight: 600;

            line-height: 1.8;
        }


        /* ================= STATUS ACTIONS ================= */

        .admin-order-status-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin: 20px 0;
            padding: 16px;
            background: #fafafa;
            border: 1px solid #eeeeee;
            border-radius: 12px;
        }

        .admin-status-action-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
        }

        .admin-status-action-info span {
            font-size: 14px;
            font-weight: 900;
            color: #333;
        }

        .admin-status-action-info small {
            font-size: 12px;
            font-weight: 600;
            color: #888;
        }

        .admin-order-status-select {
            min-width: 190px;
            height: 44px;
            padding: 0 14px;
            border: 1px solid #dedede;
            border-radius: 10px;
            background: #fff;
            color: #333;
            font-family: inherit;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            outline: none;
            transition: 0.2s ease;
        }

        .admin-order-status-select:hover {
            border-color: #aaa;
        }

        .admin-order-status-select:focus {
            border-color: #888;
            box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.05);
        }

        .admin-order-status-select:disabled {
            opacity: 0.65;
            cursor: wait;
        }

        .admin-order-status-select.is-updating {
            background: #f5f5f5;
        }

        .admin-status-message {
            position: fixed;
            left: 24px;
            bottom: 24px;
            z-index: 9999;
            max-width: calc(100vw - 48px);
            padding: 13px 18px;
            border-radius: 12px;
            background: #222;
            color: #fff;
            font-family: "Cairo", Arial, sans-serif;
            font-size: 13px;
            font-weight: 800;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            opacity: 0;
            visibility: hidden;
            transform: translateY(12px);
            transition: 0.25s ease;
            pointer-events: none;
        }

        .admin-status-message.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .admin-status-message.success {
            background: #16834b;
        }

        .admin-status-message.error {
            background: #c92a2a;
        }


        /* ================= ORDER DETAILS MODAL ================= */

        .admin-order-details-modal {
            position: fixed;
            inset: 0;
            z-index: 9998;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.55);
        }

        .admin-order-details-modal.is-open {
            display: flex;
        }

        .admin-order-details-dialog {
            width: min(880px, 100%);
            max-height: min(88vh, 900px);
            overflow: auto;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.24);
        }

        .admin-order-details-header {
            position: sticky;
            top: 0;
            z-index: 1;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;
            padding: 22px 24px;
            background: #fff;
            border-bottom: 1px solid #eeeeee;
        }

        .admin-order-details-header h2 {
            margin: 0 0 5px;
            color: #171717;
            font-size: 22px;
            font-weight: 900;
        }

        .admin-order-details-header p {
            margin: 0;
            color: #777;
            font-size: 13px;
            font-weight: 700;
        }

        .admin-order-details-close {
            width: 38px;
            height: 38px;
            border: 0;
            border-radius: 50%;
            background: #f3f4f6;
            color: #333;
            cursor: pointer;
            font-size: 18px;
        }

        .admin-order-details-content {
            padding: 24px;
        }

        .admin-details-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
            margin-bottom: 22px;
        }

        .admin-detail-item {
            padding: 13px;
            background: #fafafa;
            border: 1px solid #eeeeee;
            border-radius: 12px;
        }

        .admin-detail-item.full-width {
            grid-column: 1 / -1;
        }

        .admin-detail-item span {
            display: block;
            margin-bottom: 5px;
            color: #888;
            font-size: 12px;
            font-weight: 700;
        }

        .admin-detail-item strong {
            display: block;
            color: #333;
            font-size: 14px;
            font-weight: 800;
            overflow-wrap: anywhere;
        }

        .admin-details-section-title {
            margin: 0 0 12px;
            color: #222;
            font-size: 17px;
            font-weight: 900;
        }

        .admin-details-products {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .admin-details-product {
            display: grid;
            grid-template-columns: 64px minmax(0, 1fr) auto;
            align-items: center;
            gap: 13px;
            padding: 12px;
            border: 1px solid #eeeeee;
            border-radius: 12px;
        }

        .admin-details-product-image {
            width: 64px;
            height: 64px;
            overflow: hidden;
            border-radius: 10px;
            background: #f2f2f2;
        }

        .admin-details-product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .admin-details-product h4,
        .admin-details-product p {
            margin: 0;
        }

        .admin-details-product h4 {
            margin-bottom: 5px;
            color: #222;
            font-size: 14px;
            font-weight: 900;
        }

        .admin-details-product p {
            color: #777;
            font-size: 12px;
            font-weight: 700;
        }

        .admin-details-product-total {
            color: #222;
            font-size: 14px;
            font-weight: 900;
            white-space: nowrap;
        }

        .admin-details-total {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-top: 18px;
            padding: 17px;
            background: #171717;
            border-radius: 13px;
            color: #fff;
        }

        .admin-details-total span {
            font-size: 14px;
            font-weight: 700;
        }

        .admin-details-total strong {
            font-size: 20px;
            font-weight: 900;
        }


        /* ================= RESPONSIVE ================= */

        @media (max-width: 900px) {

            .admin-orders-stats {

                grid-template-columns:
                    repeat(2, 1fr);
            }


            .admin-order-customer {

                grid-template-columns:
                    1fr 1fr;
            }

        }


        @media (max-width: 600px) {

            .admin-orders-page {

                padding:
                    25px 12px 50px;
            }


            .admin-orders-header h1 {

                font-size: 26px;
            }


            .admin-orders-toolbar {

                flex-direction: column;

                align-items: stretch;
            }


            .admin-orders-search,
            .admin-orders-filter,
            .admin-orders-refresh {

                width: 100%;

                min-width: 0;
            }


            .admin-orders-stats {

                grid-template-columns: 1fr 1fr;

                gap: 10px;
            }


            .admin-stat-card {

                padding: 15px;
            }


            .admin-stat-card strong {

                font-size: 20px;
            }


            .admin-order-card {

                padding: 18px;

                border-radius: 15px;
            }


            .admin-order-header {

                align-items: flex-start;

                flex-direction: column;

                gap: 12px;
            }


            .admin-order-customer {

                grid-template-columns: 1fr;

                padding: 13px;
            }


            .admin-order-status-actions {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
            }

            .admin-order-status-select {
                width: 100%;
                min-width: 0;
            }

            .admin-status-message {
                left: 12px;
                right: 12px;
                bottom: 12px;
                max-width: none;
                text-align: center;
            }


            .admin-order-footer {

                flex-direction: column;

                align-items: flex-start;
            }

            .admin-order-details-btn {
                width: 100%;
            }


            .admin-total {

                width: 100%;

                text-align: right;

                padding-top: 12px;

                border-top: 1px solid #eeeeee;
            }

            .admin-order-details-modal {
                align-items: flex-end;
                padding: 0;
            }

            .admin-order-details-dialog {
                max-height: 92vh;
                border-radius: 20px 20px 0 0;
            }

            .admin-order-details-header,
            .admin-order-details-content {
                padding: 18px;
            }

            .admin-details-grid {
                grid-template-columns: 1fr;
            }

            .admin-detail-item.full-width {
                grid-column: auto;
            }

            .admin-details-product {
                grid-template-columns: 54px minmax(0, 1fr);
            }

            .admin-details-product-image {
                width: 54px;
                height: 54px;
            }

            .admin-details-product-total {
                grid-column: 2;
            }

        }

    </style>

</head>


<body>

    <main class="admin-orders-page">

        <nav class="admin-reviews-nav" aria-label="روابط الإدارة">
            <a href="admin-orders.html" class="active"><i class="fa-solid fa-receipt"></i> الطلبات</a>
            <a href="admin-products.html"><i class="fa-solid fa-box"></i> المنتجات</a>
            <a href="admin-reviews.html"><i class="fa-solid fa-star"></i> التقييمات</a>
            <a href="admin-newsletter.html"><i class="fa-solid fa-envelope"></i> النشرة البريدية</a>
        </nav>

        <!-- ================= HEADER ================= -->

        <header class="admin-orders-header">

            <h1>
                إدارة الطلبات
            </h1>

            <p>
                جميع طلبات زبناء متجر صفرو
            </p>

        </header>


        <!-- ================= TOOLBAR ================= -->

        <section class="admin-orders-toolbar">

            <input
                type="search"
                id="adminOrdersSearch"
                class="admin-orders-search"
                placeholder="بحث برقم الطلب أو اسم الزبون أو الهاتف..."
                autocomplete="off"
            >


            <select
                id="adminOrdersFilter"
                class="admin-orders-filter"
            >

                <option value="all">
                    جميع الطلبات
                </option>

                <option value="pending">
                    في انتظار التأكيد
                </option>

                <option value="confirmed">
                    تم التأكيد
                </option>

                <option value="processing">
                    جاري التجهيز
                </option>

                <option value="shipped">
                    تم الشحن
                </option>

                <option value="delivered">
                    تم التوصيل
                </option>

                <option value="cancelled">
                    ملغاة
                </option>

            </select>

            <button
                type="button"
                id="adminOrdersRefresh"
                class="admin-orders-refresh"
            >
                <i class="fa-solid fa-rotate"></i>
                تحديث الطلبات
            </button>

        </section>


        <!-- ================= STATS ================= -->

        <section
            class="admin-orders-stats"
            id="adminOrdersStats"
        >

            <div class="admin-stat-card">

                <span>
                    جميع الطلبات
                </span>

                <strong id="totalOrdersCount">
                    0
                </strong>

            </div>


            <div class="admin-stat-card">

                <span>
                    في الانتظار
                </span>

                <strong id="pendingOrdersCount">
                    0
                </strong>

            </div>


            <div class="admin-stat-card">

                <span>
                    تم التوصيل
                </span>

                <strong id="deliveredOrdersCount">
                    0
                </strong>

            </div>


            <div class="admin-stat-card">

                <span>
                    المبيعات
                </span>

                <strong id="totalSalesAmount">
                    0.00 DH
                </strong>

            </div>

        </section>


        <!-- ================= ORDERS ================= -->

        <section id="adminOrders">

            <div class="admin-orders-loading">

                <i class="fa-solid fa-spinner fa-spin"></i>

                جاري تحميل الطلبات...

            </div>

        </section>

        <div
            id="adminOrderDetailsModal"
            class="admin-order-details-modal"
            aria-hidden="true"
        >
            <section
                class="admin-order-details-dialog"
                role="dialog"
                aria-modal="true"
                aria-labelledby="adminOrderDetailsTitle"
            >
                <header class="admin-order-details-header">
                    <div>
                        <h2 id="adminOrderDetailsTitle">تفاصيل الطلب</h2>
                        <p id="adminOrderDetailsSubtitle"></p>
                    </div>

                    <button
                        type="button"
